services:
  - type: web
    name: vyapari-voice-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: GEMINI_API_KEY
        sync: false  # Set in Render dashboard
      - key: MONGODB_URI
        sync: false  # Set in Render dashboard
      - key: MONGODB_DB_NAME
        value: vyapari_voice
      - key: FRONTEND_URL
        sync: false  # Set to your Vercel URL
      - key: ENVIRONMENT
        value: production
      - key: SESSION_TTL_SECONDS
        value: "300"
    healthCheckPath: /health
